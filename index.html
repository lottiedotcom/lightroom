<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plum's Photo Editor</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Controls -->
        <aside class="sidebar">
            <h2>✨ Editor ✨</h2>
            
            <div class="control-group">
                <button id="upload-btn" class="btn blue-btn">Upload Photo</button>
                <input type="file" id="file-upload" accept="image/*" hidden>
                <button id="download-btn" class="btn blue-btn">Download Image</button>
            </div>

            <div class="control-group preset-group">
                <h3>Presets</h3>
                <div class="preset-buttons">
                    <button id="copy-preset" class="btn pink-btn small">Copy</button>
                    <button id="paste-preset" class="btn pink-btn small">Paste</button>
                    <button id="save-preset" class="btn pink-btn small">Save</button>
                    <button id="load-preset-btn" class="btn pink-btn small">Load</button>
                    <input type="file" id="load-preset" accept=".json" hidden>
                </div>
            </div>

            <div class="sliders-container">
                <!-- Light -->
                <h3>Light</h3>
                <label>Exposure <input type="range" id="exposure" min="-100" max="100" value="0"></label>
                <label>Contrast <input type="range" id="contrast" min="-100" max="100" value="0"></label>
                <label>Highlights <input type="range" id="highlights" min="-100" max="100" value="0"></label>
                <label>Shadows <input type="range" id="shadows" min="-100" max="100" value="0"></label>
                <label>Whites <input type="range" id="whites" min="-100" max="100" value="0"></label>
                <label>Blacks <input type="range" id="blacks" min="-100" max="100" value="0"></label>

                <!-- Color -->
                <h3>Color</h3>
                <label>Temperature <input type="range" id="temp" min="-100" max="100" value="0"></label>
                <label>Tint <input type="range" id="tint" min="-100" max="100" value="0"></label>
                <label>Vibrance <input type="range" id="vibrance" min="-100" max="100" value="0"></label>
                <label>Saturation <input type="range" id="saturation" min="-100" max="100" value="0"></label>

                <!-- Effects -->
                <h3>Effects</h3>
                <label>Blur <input type="range" id="blur" min="0" max="50" value="0"></label>
                <label>Clarity <input type="range" id="clarity" min="-100" max="100" value="0"></label>
                <label>Grain <input type="range" id="grain" min="0" max="100" value="0"></label>
                
                <button id="reset-btn" class="btn main-btn">Reset All</button>
            </div>
        </aside>

        <!-- Main Preview Area -->
        <main class="preview-area">
            <canvas id="canvas"></canvas>
            <p id="status">Upload an image to start editing 🎀</p>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
